<!DOCTYPE html>
<html>
<head>
<title>PixelOrchestrator Control Center</title>

<style>
body {
  background:#0b0f14;
  color:white;
  font-family:Arial;
}

.header {
  color:#00ffcc;
  font-size:22px;
}

.panel {
  display:flex;
  gap:10px;
}

.box {
  flex:1;
  background:#151b25;
  padding:10px;
  border-radius:10px;
}

.event {
  font-size:12px;
  color:#00ff88;
}

.device {
  color:#66ccff;
}
</style>
</head>

<body>

<div class="header">🚀 CONTROL CENTER (AWS STYLE MINI ORCHESTRATOR)</div>

<div class="panel">

  <div class="box">
    <h3>📡 Connection</h3>
    <div id="status">Connecting...</div>
  </div>

  <div class="box">
    <h3>📱 Devices</h3>
    <div id="devices"></div>
  </div>

  <div class="box">
    <h3>⚡ Events</h3>
    <div id="events"></div>
  </div>

</div>

<script>
const statusEl = document.getElementById("status");
const eventsEl = document.getElementById("events");
const devicesEl = document.getElementById("devices");

let authenticated = false;
let pendingMessages = [];
let closingAfterAuthFailure = false;

const dashboardToken = window.prompt(
  "Paste your PixelOrchestrator dashboard token:"
);

function renderDashboardMessage(data) {
  const ev = document.createElement("div");
  ev.className = "event";
  ev.innerText = JSON.stringify(data);
  eventsEl.prepend(ev);

  if (data.type === "DEVICE_CONNECTED") {
    const d = document.createElement("div");
    d.className = "device";
    d.innerText = "Device: " + String(data.payload ?? "");
    devicesEl.appendChild(d);
  }
}

if (!dashboardToken || !dashboardToken.trim()) {
  statusEl.innerText = "Authentication cancelled — token required.";
} else {
  const ws = new WebSocket("ws://127.0.0.1:8000");

  ws.onopen = () => {
    statusEl.innerText = "Authenticating...";
    ws.send(JSON.stringify({
      type: "dashboard_connect",
      token: dashboardToken,
      last_offset: 0
    }));
  };

  ws.onmessage = (msg) => {
    let data;

    try {
      data = JSON.parse(msg.data);
    } catch {
      statusEl.innerText = "Invalid server response.";
      return;
    }

    if (data.type === "dashboard_connect_response") {
      if (data.success !== true) {
        closingAfterAuthFailure = true;
        statusEl.innerText = "Authentication failed: " +
          String(data.error || "access denied");
        pendingMessages = [];
        ws.close();
        return;
      }

      authenticated = true;
      statusEl.innerText = "Authenticated";
      pendingMessages.forEach(renderDashboardMessage);
      pendingMessages = [];
      return;
    }

    if (authenticated) {
      renderDashboardMessage(data);
    } else {
      pendingMessages.push(data);
    }
  };

  ws.onerror = () => {
    statusEl.innerText = "WebSocket connection error.";
  };

  ws.onclose = () => {
    authenticated = false;
    if (!closingAfterAuthFailure) {
      statusEl.innerText = "Disconnected.";
    }
  };
}
</script>

</body>
</html>
