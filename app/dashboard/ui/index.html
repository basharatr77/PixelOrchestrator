<!DOCTYPE html>
<html>
<head>
  <title>PixelOrchestrator Live Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0f1117;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #00ffcc;
    }

    .box {
      background: #1a1d25;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
    }

    #events {
      height: 300px;
      overflow-y: auto;
      background: black;
      padding: 10px;
    }

    .event {
      color: #00ff88;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .device {
      color: #66ccff;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<h1>🚀 PixelOrchestrator Live Dashboard</h1>

<div class="box">
  <h2>📡 Connection</h2>
  <div id="status">Connecting...</div>
</div>

<div class="box">
  <h2>📱 Devices</h2>
  <div id="devices"></div>
</div>

<div class="box">
  <h2>⚡ Live Events</h2>
  <div id="events"></div>
</div>

<script>
const statusEl = document.getElementById("status");
const eventsEl = document.getElementById("events");
const devicesEl = document.getElementById("devices");

let authenticated = false;
let pendingMessages = [];

const dashboardToken = window.prompt(
  "Paste your PixelOrchestrator dashboard token:"
);

function renderDashboardMessage(data) {
  const ev = document.createElement("div");
  ev.className = "event";
  ev.innerText = JSON.stringify(data);
  eventsEl.appendChild(ev);

  if (data.type === "DEVICE_CONNECTED") {
    const d = document.createElement("div");
    d.className = "device";
    d.innerText = "Device: " + String(data.payload ?? "");
    devicesEl.appendChild(d);
  }
}

if (!dashboardToken || !dashboardToken.trim()) {
  statusEl.innerText = "Authentication cancelled — token required.";
} else {
  const ws = new WebSocket("ws://127.0.0.1:8000");

  ws.onopen = () => {
    statusEl.innerText = "Authenticating...";
    ws.send(JSON.stringify({
      type: "dashboard_connect",
      token: dashboardToken,
      last_offset: 0
    }));
  };

  ws.onmessage = (msg) => {
    let data;

    try {
      data = JSON.parse(msg.data);
    } catch {
      statusEl.innerText = "Invalid server response.";
      return;
    }

    if (data.type === "dashboard_connect_response") {
      if (data.success !== true) {
        statusEl.innerText = "Authentication failed: " +
          String(data.error || "access denied");
        pendingMessages = [];
        ws.close();
        return;
      }

      authenticated = true;
      statusEl.innerText = "Authenticated";
      pendingMessages.forEach(renderDashboardMessage);
      pendingMessages = [];
      return;
    }

    if (authenticated) {
      renderDashboardMessage(data);
    } else {
      pendingMessages.push(data);
    }
  };

  ws.onerror = () => {
    statusEl.innerText = "WebSocket connection error.";
  };

  ws.onclose = () => {
    authenticated = false;
    statusEl.innerText = "Disconnected.";
  };
}
</script>

</body>
</html>
